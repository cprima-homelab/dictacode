[project]
name = "dictacode-stt"
version = "0.3.9"
description = "dictacode Pi5 STT sidecar"
requires-python = ">=3.9"
dependencies = [
    "sounddevice>=0.4",
    "pyserial>=3.5",
    "numpy>=1.20",
    "msgpack>=1.0",
    "systemd-python>=235",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "prometheus_client>=0.19",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "cryptography>=41.0",  # v0.3.3: Ed25519 license token verification
]

[project.scripts]
dictacode-stt = "dictacode_stt.main:main"
dictacode-stt-check = "dictacode_stt.diagnostics:check_main"
dictacode-stt-diagnose = "dictacode_stt.diagnostics:diagnose_main"
dictacode-stt-state = "dictacode_stt.diagnostics:state_main"
dictacode-stt-audio = "dictacode_stt.cli:audio_main"
dictacode-stt-whisper = "dictacode_stt.cli:whisper_main"
dictacode-stt-send = "dictacode_stt.cli:send_main"
dictacode-stt-hid = "dictacode_stt.cli:hid_main"
dictacode-stt-log = "dictacode_stt.cli:log_main"
dictacode-stt-bugreport = "dictacode_stt.cli:bugreport_main"
dictacode-stt-api = "dictacode_stt.api_server:api_main"
dictacode-license = "dictacode_stt.license_cli:main"  # v0.3.3: license management CLI

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dictacode_stt"]

[tool.hatch.build.targets.wheel.shared-data]
"src/dictacode_stt/compatibility.json" = "share/dictacode_stt/compatibility.json"

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | venv
    | __pycache__
    | \.mypy_cache
    | build
    | dist
)/
'''

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Gradual typing - start permissive
check_untyped_defs = true
ignore_missing_imports = true  # Third-party libs without stubs

# Stricter settings for new code (enable gradually)
# disallow_untyped_defs = true
# strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
