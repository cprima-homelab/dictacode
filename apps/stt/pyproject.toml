[project]
name = "dictacode-stt"
version = "0.1.0"
description = "dictacode Pi5 STT sidecar"
requires-python = ">=3.9"
dependencies = [
    "sounddevice>=0.4",
    "pyserial>=3.5",
    "numpy>=1.20",
    "msgpack>=1.0",
]

[project.scripts]
dictacode-stt = "dictacode_stt.main:main"
dictacode-stt-check = "dictacode_stt.diagnostics:check_main"
dictacode-stt-diagnose = "dictacode_stt.diagnostics:diagnose_main"

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dictacode_stt"]
