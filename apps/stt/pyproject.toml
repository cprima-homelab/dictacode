[project]
name = "dictacode-stt"
version = "0.3.0"
description = "dictacode Pi5 STT sidecar"
requires-python = ">=3.9"
dependencies = [
    "sounddevice>=0.4",
    "pyserial>=3.5",
    "numpy>=1.20",
    "msgpack>=1.0",
    "systemd-python>=235",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "prometheus_client>=0.19",
    "jinja2>=3.1",
]

[project.scripts]
dictacode-stt = "dictacode_stt.main:main"
dictacode-stt-check = "dictacode_stt.diagnostics:check_main"
dictacode-stt-diagnose = "dictacode_stt.diagnostics:diagnose_main"
dictacode-stt-audio = "dictacode_stt.cli:audio_main"
dictacode-stt-whisper = "dictacode_stt.cli:whisper_main"
dictacode-stt-send = "dictacode_stt.cli:send_main"
dictacode-stt-hid = "dictacode_stt.cli:hid_main"
dictacode-stt-log = "dictacode_stt.cli:log_main"
dictacode-stt-bugreport = "dictacode_stt.cli:bugreport_main"
dictacode-stt-api = "dictacode_stt.api_server:api_main"

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dictacode_stt"]

[tool.hatch.build.targets.wheel.shared-data]
"src/dictacode_stt/compatibility.json" = "share/dictacode_stt/compatibility.json"
