<!DOCTYPE html>
<html lang="en" data-theme="solarized-light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}dictacode{% endblock %} - STT Control Panel</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/themes/solarized-light.css">
    <link rel="stylesheet" href="/static/css/themes/solarized-dark.css">
    <link rel="stylesheet" href="/static/css/themes/work.css">
    {% block extra_css %}{% endblock %}
</head>
<body class="layout">
    <aside class="nav">
        <nav>
            <a href="/" class="nav-item {% block nav_dashboard %}{% endblock %}">
                <span class="icon">&#128202;</span>
                <span class="label">Dashboard</span>
            </a>
            <a href="/config" class="nav-item {% block nav_config %}{% endblock %}">
                <span class="icon">&#9881;</span>
                <span class="label">Config</span>
            </a>
            <a href="/diagnostics" class="nav-item {% block nav_diagnostics %}{% endblock %}">
                <span class="icon">&#128295;</span>
                <span class="label">Diagnostics</span>
            </a>
            <a href="/metrics" class="nav-item {% block nav_metrics %}{% endblock %}">
                <span class="icon">&#128200;</span>
                <span class="label">Metrics</span>
            </a>
        </nav>

        <div class="theme-switcher">
            <button data-theme="solarized-light" aria-label="Solarized Light Theme">&#9728;</button>
            <button data-theme="solarized-dark" aria-label="Solarized Dark Theme">&#127769;</button>
            <button data-theme="work" aria-label="Work Theme">&#128188;</button>
        </div>
    </aside>

    <main class="main">
        <header class="toolbar">
            <span class="brand">dictacode</span>
            <nav class="breadcrumbs">
                <span>{% block breadcrumb %}Dashboard{% endblock %}</span>
            </nav>
            <div class="status-cluster">
                <span class="badge badge-ok" id="service-status">&#9679; Listening</span>
                <span class="badge badge-ok" id="link-status">Link OK</span>
            </div>
        </header>

        <section class="content">
            {% block content %}{% endblock %}
        </section>
    </main>

    <script src="/static/js/theme-switcher.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
