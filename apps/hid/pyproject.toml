[project]
name = "dictacode-hid"
version = "0.1.0"
description = "dictacode Zero HID bridge (stub)"
requires-python = ">=3.9"
dependencies = [
    "pyserial>=3.5",
    "msgpack>=1.0",
]

[project.scripts]
dictacode-keymap = "dictacode_hid.cli:main"
# dictacode-hid entry point removed - use sandbox/recv_uart_type.py

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dictacode_hid"]
