[project]
name = "dictacode-hid"
version = "0.3.9"
description = "dictacode Zero HID bridge (stub)"
requires-python = ">=3.9"
dependencies = [
    "pyserial>=3.5",
    "msgpack>=1.0",
    "systemd-python>=235",
]

[project.scripts]
dictacode-hid = "dictacode_hid.main:main"
dictacode-keymap = "dictacode_hid.cli:main"
dictacode-hid-check = "dictacode_hid.diagnostics:check_main"
dictacode-hid-diagnose = "dictacode_hid.diagnostics:diagnose_main"

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dictacode_hid"]

[tool.hatch.build.targets.wheel.shared-data]
"src/dictacode_hid/compatibility.json" = "share/dictacode_hid/compatibility.json"

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | venv
    | __pycache__
    | \.mypy_cache
    | build
    | dist
)/
'''

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Gradual typing - start permissive
check_untyped_defs = true
ignore_missing_imports = true  # Third-party libs without stubs

# Stricter settings for new code (enable gradually)
# disallow_untyped_defs = true
# strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
