# RØDE VideoMic NTG audio device profile
# Optimized settings for RØDE VideoMic NTG USB microphone
#
# Applied when:
# - Device name matches "RØDE VideoMic NTG"
# - Port ID is "rode-videomic-ntg"
#
# Device specifications:
# - Native sample rate: 48kHz
# - Channels: 2 (stereo), converted to mono
# - Connection: USB
#
# v0.2.4 - Audio Port Abstraction

[device]
# Device identification
match_name = RØDE VideoMic NTG
match_port_id = rode-videomic-ntg
vendor = RØDE
model = VideoMic NTG
description = RØDE VideoMic NTG Professional Shotgun Microphone

[audio]
# Buffer settings - optimized for speech clarity
buffer_size_seconds = 5.0
overlap_seconds = 0.5  # 500ms overlap prevents word cutoff

# Sample rate conversion
# Device native: 48000 Hz
# Whisper target: 16000 Hz (3:1 downsample ratio)
target_sample_rate = 16000

# Recording parameters
# Note: RØDE NTG is stereo but we convert to mono for transcription
channels = 1
dtype = int16

# Chunk size for streaming (samples per callback)
# Smaller chunks = lower latency, higher CPU
# Larger chunks = higher latency, lower CPU
chunk_size = 1024

[transcription]
# Minimum duration to wait before transcribing
# RØDE NTG has good clarity, can transcribe shorter segments
min_duration = 3.0

# Language for transcription
language = en

[advanced]
# Enable streaming mode (continuous capture)
streaming_enabled = true

# Enable overlap deduplication
deduplication_enabled = true

# Maximum words to check for overlap
max_overlap_words = 10

# Device-specific notes
# The RØDE VideoMic NTG has excellent clarity and low self-noise,
# making it ideal for dictation and speech-to-text applications.
# The 48kHz native rate provides high quality that downsamples well.
