# Generic audio device profile (baseline)
# This profile provides sensible defaults for unknown audio devices.
#
# Applied when:
# - No specific device profile matches
# - Serves as fallback for all devices
#
# v0.2.4 - Audio Port Abstraction

[device]
# Device identification (not used for matching - this is the fallback)
description = Generic USB/ALSA Audio Device

[audio]
# Buffer settings
buffer_size_seconds = 5.0
overlap_seconds = 0.5

# Sample rate conversion
# Most USB mics support 48kHz, but we resample to 16kHz for Whisper
target_sample_rate = 16000

# Recording parameters
channels = 1
dtype = int16

# Chunk size for streaming (samples per callback)
chunk_size = 1024

[transcription]
# Minimum duration to wait before transcribing (seconds)
min_duration = 3.0

# Language for transcription
language = en

[advanced]
# Enable/disable streaming mode (vs blocking record)
# true: continuous streaming with ring buffer
# false: blocking record (legacy mode)
streaming_enabled = true

# Enable/disable overlap deduplication
deduplication_enabled = true

# Maximum words to check for overlap (cap to prevent excessive processing)
max_overlap_words = 10
