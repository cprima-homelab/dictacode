# dictacode Audio Configuration
# Main configuration file for audio port abstraction
#
# This file controls:
# - Profile matching behavior
# - Global audio settings
# - Port selection preferences
#
# v0.2.4 - Audio Port Abstraction

[profiles]
# Directory containing device-specific profiles
profiles_dir = /etc/dictacode/audio/profiles

# Profile matching strategy
# Options: exact, vendor, generic
# - exact: Match exact device name/port_id
# - vendor: Match by vendor name (e.g., "RØDE" → rode-*.conf)
# - generic: Always use generic.conf
matching_strategy = exact

# Fallback to generic profile if no match found
fallback_to_generic = true

[ports]
# Default port selection when multiple ports available
# Options: first, last, prefer_usb, prefer_jack
default_selection = prefer_usb

# Port preference order (comma-separated port types)
# Used when default_selection = auto
preference_order = usb, jack, alsa

[audio]
# Global audio settings (can be overridden by device profiles)

# Enable/disable audio port abstraction entirely
# If disabled, falls back to legacy sounddevice direct access
enabled = true

# Ring buffer settings
default_buffer_size_seconds = 5.0
default_overlap_seconds = 0.5

# Target sample rate for Whisper
whisper_sample_rate = 16000

[logging]
# Log port discovery and selection
log_port_discovery = true

# Log profile matching
log_profile_matching = true

# Log audio buffer statistics
log_buffer_stats = false

[advanced]
# Refresh port list on each access (slower but handles hot-plug)
# false: cache port list until restart (faster)
# true: re-scan on each list_ports() call
refresh_on_access = false

# Hot-plug detection interval (seconds)
# Only used if refresh_on_access = true
hotplug_scan_interval = 5.0
