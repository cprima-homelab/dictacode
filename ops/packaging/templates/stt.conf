# dictacode STT Configuration
# v0.3.2 - Unified configuration with drop-in support
#
# Override these settings with drop-in files in the stt.d/ directory.
# Files are read in sorted order (00-base.conf, 10-audio.conf, etc.)
#
# CLI flags override these settings: dictacode-stt --help
# See paths.py for platform-specific install locations.

# === Whisper Model ===
# Model to use (installed by install-whisper.sh)
# Options: tiny, base, small, medium, large
model = tiny

# Additional models to download (comma-separated)
# Run install-whisper.sh after changing to download new models
# models_extra = base,small

# Language for transcription
language = en

# === Transport ===
# UART device path (platform-specific default)
uart_device = /dev/serial0
uart_baud = 115200

# Protocol: json or msgpack
protocol = json

# === Audio ===
# Audio chunk duration in seconds
chunk_duration = 5

# Audio configuration directory
# audio_config_dir = /etc/dictacode/audio

# === Supervisor (link health monitoring) ===
supervisor_enabled = true
supervisor_timeout = 30.0
supervisor_ping_interval = 5.0

# === Logging ===
# Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
log_level = INFO
# Log format: simple, json, systemd
# log_format = simple
# Log file (optional, leave empty for console/journald)
# log_file =

# === Main Service Prometheus Metrics ===
# Enable metrics endpoint for main STT service
metrics_enabled = false
metrics_port = 9100

# === API Server Configuration ===
# REST API server settings (enable/disable via systemctl)
api_host = 127.0.0.1
api_port = 8000
# api_config_dir = /etc/dictacode/audio

# API Server Prometheus Metrics
api_metrics_enabled = false
api_metrics_port = 9101

# === LLM Post-Processing (v0.3.1+) ===
# llm_enabled = false
# llm_provider = ollama
# llm_model = llama3.2
# llm_profile = passthrough
# llm_fallback = true
# llm_base_url =
# llm_api_key =

# === Behavior ===
# dry_run = false
