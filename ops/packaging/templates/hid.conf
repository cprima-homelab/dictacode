# dictacode HID Configuration
# v0.3.2 - Unified configuration with drop-in support
#
# Override these settings with drop-in files in the hid.d/ directory.
# Files are read in sorted order (00-base.conf, 10-transport.conf, etc.)
#
# CLI flags override these settings: dictacode-hid --help
# See paths.py for platform-specific install locations.

# === Transport ===
# UART device path (platform-specific default)
uart_device = /dev/serial0
# Baud rate (9600, 19200, 38400, 57600, 115200, 230400)
uart_baud = 115200
# HID gadget device path (platform-specific)
hid_device = /dev/hidg0
# Protocol: json or msgpack
protocol = json

# === Mode & Keymap ===
# Initial mode: normal, maintenance, paused
initial_mode = normal
# Keyboard layout: en_us, de_de
initial_keymap = en_us
# Keymap configuration file
# keymap_config = /etc/dictacode/keymap.conf
# HID device registry directory
# hid_registry_dir = /etc/dictacode/hid/devices.d

# === Supervisor (link health monitoring) ===
supervisor_enabled = true
supervisor_timeout = 30.0
supervisor_ping_interval = 5.0

# === Logging ===
# Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
log_level = INFO
# Log format: simple, json, systemd
# log_format = simple
# Log file (optional, leave empty for console/journald)
# log_file =

# === Behavior ===
# dry_run = false
