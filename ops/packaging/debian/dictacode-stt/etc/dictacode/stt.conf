# dictacode STT configuration

# Whisper model to use (installed by install-whisper.sh)
# Options: tiny, base, small, medium, large
model=tiny

# Additional models to download (comma-separated)
# Run install-whisper.sh after changing to download new models
#models_extra=base,small

# Language for transcription
language=en

# UART device for output
uart_device=/dev/serial0
uart_baud=115200

# Audio chunk duration in seconds
chunk_duration=5

# Main Service Prometheus Metrics (v0.2.15+)
# Enable metrics endpoint for main STT service
metrics_enabled=false
metrics_port=9100

# API Server Configuration (v0.2.15+)
# REST API server settings (enable/disable via systemctl)
api_host=127.0.0.1
api_port=8000
api_config_dir=/etc/dictacode/audio

# API Server Prometheus Metrics (v0.2.15+)
# Separate metrics endpoint for API server
api_metrics_enabled=false
api_metrics_port=9101
