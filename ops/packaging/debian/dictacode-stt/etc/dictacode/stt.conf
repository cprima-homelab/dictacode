# dictacode STT configuration

# Whisper model to use (installed by install-whisper.sh)
# Options: tiny, base, small, medium, large
model=tiny

# Additional models to download (comma-separated)
# Run install-whisper.sh after changing to download new models
#models_extra=base,small

# Language for transcription
language=en

# UART device for output
uart_device=/dev/serial0
uart_baud=115200

# Audio chunk duration in seconds
chunk_duration=5
